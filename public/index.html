<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Mixora — Премиум инвентаризация</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root{--bg-deep:#0E0E10;--bg-graphite:#1A1A1E;--accent-amber:#D4A843;--accent-gold:#F3D078;--text-primary:#FFFFFF;--text-secondary:rgba(255,255,255,0.6);--glass-bg:rgba(255,255,255,0.05);--glass-border:rgba(255,255,255,0.1);--alert-low:rgba(212,168,67,0.15);--success-pulse:#2EE59D;}
        *{margin:0;padding:0;box-sizing:border-box;}
        body{background:radial-gradient(circle at 50% 0%,#1A1A1E 0%,#0E0E10 80%);font-family:'Unbounded',sans-serif;color:var(--text-primary);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:16px;margin:0;}
        .app-container{width:100%;max-width:460px;min-height:85vh;}
        .screen{display:flex;flex-direction:column;gap:14px;}
        .glass-card{background:var(--glass-bg);backdrop-filter:blur(25px);border:1px solid var(--glass-border);border-radius:16px;padding:16px;box-shadow:0 10px 30px rgba(0,0,0,0.5);}
        .fade-in{animation:fadeUp 0.4s ease-out both;}
        @keyframes fadeUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
        .logo-icon{width:36px;height:36px;background:linear-gradient(135deg,var(--accent-amber),var(--accent-gold));border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:700;color:#000;box-shadow:0 8px 16px rgba(212,168,67,0.3);}
        .glass-input{width:100%;background:rgba(0,0,0,0.4);border:1px solid rgba(255,255,255,0.15);border-radius:10px;padding:12px 14px;font-size:15px;color:white;font-family:'Unbounded',sans-serif;outline:none;transition:0.2s;}
        .glass-input:focus{border-color:var(--accent-amber);box-shadow:0 0 12px rgba(212,168,67,0.2);}
        select.glass-input{appearance:none;cursor:pointer;color:white;}
        .glass-btn{background:var(--glass-bg);backdrop-filter:blur(20px);border:1px solid var(--glass-border);border-radius:12px;padding:12px 16px;color:white;font-family:'Unbounded',sans-serif;font-weight:500;font-size:13px;cursor:pointer;transition:0.2s;display:flex;align-items:center;justify-content:center;gap:6px;}
        .glass-btn:active{transform:scale(0.96);}
        .glass-btn.primary{background:linear-gradient(135deg,rgba(212,168,67,0.25),rgba(212,168,67,0.05));border-color:var(--accent-amber);color:var(--accent-gold);}
        .full-width{width:100%;}
        .input-group{margin-bottom:14px;}
        .input-group label{display:block;color:var(--text-secondary);font-size:12px;margin-bottom:6px;}
        .badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:10px;font-weight:500;background:rgba(212,168,67,0.2);color:var(--accent-gold);}
        .badge.manager{background:rgba(46,229,157,0.2);color:#2EE59D;}
        .btn-sm{padding:5px 10px;font-size:10px;border-radius:8px;border:1px solid var(--glass-border);background:rgba(255,255,255,0.05);color:var(--text-secondary);cursor:pointer;font-family:'Unbounded',sans-serif;transition:0.2s;}
        .btn-sm.edit{color:var(--accent-gold);border-color:rgba(212,168,67,0.3);}
        .btn-sm.danger{color:#ff6b6b;border-color:rgba(255,107,107,0.3);}
        .btn-sm.switch{color:var(--accent-gold);border-color:rgba(212,168,67,0.3);}
        .bar-card{cursor:pointer;margin-bottom:12px;}
        .bar-actions{display:flex;gap:8px;margin-top:10px;}
        .inventory-item{margin-bottom:10px;}
        .inventory-section{background:rgba(0,0,0,0.2);border-radius:10px;padding:10px;margin:8px 0;}
        .inventory-section-title{font-size:12px;color:var(--text-secondary);margin-bottom:6px;display:flex;align-items:center;gap:4px;}
        .calc-result{font-size:12px;color:rgba(255,255,255,0.4);margin-top:4px;text-align:right;}
        .total-display{font-size:16px;font-weight:600;color:var(--accent-gold);text-align:right;margin-top:8px;}
        .previous-display{font-size:11px;color:rgba(255,255,255,0.35);text-align:right;}
        .item-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
        .item-name{font-weight:500;font-size:15px;}
        .unit-badge{font-size:11px;background:rgba(255,255,255,0.1);padding:3px 8px;border-radius:20px;color:var(--text-secondary);}
        .modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.8);backdrop-filter:blur(5px);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px;}
        .modal-content{background:var(--glass-bg);backdrop-filter:blur(30px);border:1px solid var(--glass-border);border-radius:20px;padding:24px;width:100%;max-width:400px;}
        .select-role{display:flex;gap:10px;margin-bottom:16px;}
        .role-option{flex:1;padding:12px;border:1px solid var(--glass-border);border-radius:12px;text-align:center;cursor:pointer;background:rgba(0,0,0,0.3);transition:0.2s;font-size:13px;color:var(--text-secondary);}
        .role-option.active{border-color:var(--accent-amber);background:rgba(212,168,67,0.2);color:var(--accent-gold);}
        .row{display:flex;gap:8px;align-items:center;}
        .row .glass-input{flex:1;}
        .row select{width:auto;min-width:80px;}
        .warning{border-left:3px solid var(--accent-amber);background:var(--alert-low);}
        .export-section{display:flex;gap:10px;margin-top:8px;}
        .header{display:flex;justify-content:space-between;align-items:center;}
        .list-group{max-height:55vh;overflow-y:auto;display:flex;flex-direction:column;gap:10px;}
        .manager-email-hint{font-size:10px;color:var(--text-secondary);margin-top:-6px;margin-bottom:10px;text-align:center;}
        .logout-btn{background:none;border:1px solid rgba(255,107,107,0.3);border-radius:8px;color:#ff6b6b;padding:6px 12px;font-size:10px;cursor:pointer;font-family:'Unbounded',sans-serif;}
        .upload-area{border:2px dashed var(--glass-border);border-radius:14px;padding:20px;text-align:center;cursor:pointer;margin-bottom:12px;}
        .upload-area.dragover{border-color:var(--accent-gold);background:rgba(212,168,67,0.1);}
        .file-name{font-size:12px;color:var(--accent-gold);margin-top:8px;}
        .progress-bar{width:100%;height:4px;background:rgba(255,255,255,0.1);border-radius:4px;margin-top:12px;overflow:hidden;display:none;}
        .progress-bar-fill{height:100%;background:var(--accent-amber);border-radius:4px;transition:width 0.3s;}
        .bartender-row{display:flex;justify-content:space-between;align-items:center;padding:12px;background:rgba(0,0,0,0.2);border-radius:10px;margin-bottom:8px;}
        .search-box{position:relative;margin-bottom:8px;}
        .search-box input{padding-left:36px;padding-right:36px;}
        .search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text-secondary);font-size:16px;}
        .clear-search{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--text-secondary);cursor:pointer;font-size:18px;display:none;}
        .tabs-container{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:8px;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
        .tabs-container::-webkit-scrollbar{display:none;}
        .tab-btn{padding:8px 14px;border-radius:20px;font-size:11px;white-space:nowrap;cursor:pointer;transition:0.2s;background:rgba(255,255,255,0.05);border:1px solid var(--glass-border);color:var(--text-secondary);font-family:'Unbounded',sans-serif;}
        .tab-btn.active{background:rgba(212,168,67,0.25);border-color:var(--accent-amber);color:var(--accent-gold);font-weight:500;}
        .no-results{text-align:center;padding:30px;color:var(--text-secondary);font-size:14px;}
        .type-menu-wrapper{position:relative;display:inline-block;}
        .type-dropdown{position:absolute;bottom:100%;right:0;margin-bottom:6px;background:rgba(20,20,25,0.97);backdrop-filter:blur(25px);border:1px solid var(--glass-border);border-radius:12px;padding:6px;z-index:200;min-width:150px;box-shadow:0 10px 30px rgba(0,0,0,0.7);display:none;}
        .type-dropdown.show{display:block;}
        .type-option{padding:10px 14px;cursor:pointer;border-radius:8px;font-size:12px;transition:0.15s;display:flex;align-items:center;gap:8px;}
        .type-option:hover{background:rgba(212,168,67,0.15);color:var(--accent-gold);}
        .type-option.active{background:rgba(212,168,67,0.2);color:var(--accent-gold);}
        .quick-add-btn{width:32px;height:32px;border-radius:8px;border:1px solid var(--glass-border);background:rgba(212,168,67,0.1);color:var(--accent-gold);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:0.2s;flex-shrink:0;}
        .quick-add-btn:hover{background:rgba(212,168,67,0.25);}
        .quick-add-popup{position:absolute;top:100%;right:0;margin-top:6px;background:rgba(20,20,25,0.98);backdrop-filter:blur(25px);border:1px solid var(--accent-amber);border-radius:12px;padding:12px;z-index:300;width:180px;box-shadow:0 10px 30px rgba(0,0,0,0.8);display:none;}
        .quick-add-popup.show{display:block;}
        .quick-add-popup input{width:100%;background:rgba(0,0,0,0.4);border:1px solid rgba(255,255,255,0.15);border-radius:8px;padding:8px 10px;font-size:14px;color:white;font-family:'Unbounded',sans-serif;outline:none;text-align:center;margin-bottom:8px;}
        .quick-add-popup input:focus{border-color:var(--accent-amber);}
        .quick-add-actions{display:flex;gap:6px;}
        .quick-add-actions button{flex:1;padding:6px;border-radius:8px;font-size:10px;cursor:pointer;font-family:'Unbounded',sans-serif;border:1px solid var(--glass-border);background:rgba(255,255,255,0.05);color:var(--text-secondary);transition:0.2s;}
        .quick-add-actions button.primary{background:var(--accent-amber);color:#000;border-color:var(--accent-amber);font-weight:600;}
        .opened-info{color:var(--text-secondary);font-size:10px;margin-top:4px;}
        .opened-info b{color:var(--accent-gold);}
        .unit-hint{font-size:10px;color:var(--accent-gold);margin-left:4px;}
    </style>
</head>
<body><div id="app" class="app-container"></div>
<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
const app = document.getElementById('app');
let currentUser = null, currentBarId = null, currentBarName = '', inventoryItems = [], myBars = [];
let activeCategory = 'all', searchQuery = '';

const stdVolumesL = [0.33, 0.5, 0.7, 0.75, 1.0, 5, 10, 20, 30, 50];
const catNames = {all:'📦 Все', alcohol:'🍸 Алкоголь', wine:'🍷 Вино', beer:'🍺 Пиво/Кеги', drinks:'🥤 Напитки', ingredients:'🧂 Ингредиенты', dishes:'🍽️ Посуда'};
function volLabel(v) { return v >= 5 ? `${v} л (кег)` : `${v} л`; }

document.addEventListener('click', () => { 
    document.querySelectorAll('.type-dropdown').forEach(d => d.classList.remove('show')); 
    document.querySelectorAll('.quick-add-popup').forEach(p => p.classList.remove('show'));
});

function toggleTypeMenu(event, itemId) {
    event.stopPropagation(); event.preventDefault();
    document.querySelectorAll('.type-dropdown').forEach(d => { if (d.dataset.id !== String(itemId)) d.classList.remove('show'); });
    const dd = document.querySelector(`.type-dropdown[data-id="${itemId}"]`);
    if (dd) dd.classList.toggle('show');
}

function changeItemType(itemId, newUnit) {
    const item = inventoryItems.find(i => i.id === itemId);
    if (!item || item.unit === newUnit) return;
    item.unit = newUnit;
    item.sealed_count = 0; item.sealed_volume = 0.7;
    item.opened_count = 0; item.opened_volume = 0.7;
    item.opened_remainder = 0; item.total_volume = 0; item.broken_count = 0;
    socket.emit('updateItem', {
        itemId: itemId, name: item.name, unit: newUnit, category: item.category || 'alcohol',
        sealed_count: 0, sealed_volume: 0.7, opened_count: 0, opened_volume: 0.7,
        opened_remainder: 0, total_volume: 0, broken_count: 0, barId: currentBarId
    });
    document.querySelectorAll('.type-dropdown').forEach(d => d.classList.remove('show'));
    renderInventory();
}

function showQuickAdd(event, itemId, fieldName) {
    event.stopPropagation(); event.preventDefault();
    document.querySelectorAll('.quick-add-popup').forEach(p => p.classList.remove('show'));
    const popup = document.getElementById(`quickAdd-${itemId}-${fieldName}`);
    if (popup) { popup.classList.add('show'); const inp = popup.querySelector('input'); if (inp) { inp.value = ''; setTimeout(() => inp.focus(), 100); } }
}

function doQuickAdd(itemId, fieldName) {
    const popup = document.getElementById(`quickAdd-${itemId}-${fieldName}`);
    const input = popup ? popup.querySelector('input') : null;
    if (!input) return;
    const addVal = parseFloat(input.value);
    if (isNaN(addVal) || addVal <= 0) return;
    const item = inventoryItems.find(i => i.id === itemId);
    if (!item) return;
    const card = document.querySelector(`.inventory-item[data-item-id="${itemId}"]`);
    if (!card) return;
    if (fieldName === 'sealed') {
        item.sealed_count = +((item.sealed_count || 0) + addVal).toFixed(3);
        const sv = item.sealed_volume || 0.7;
        item.total_volume = +((item.sealed_count) * sv + (item.opened_count || 0) * (item.opened_remainder || 0)).toFixed(3);
        socket.emit('updateItem', { itemId, name: item.name, unit: item.unit, category: item.category || 'alcohol', sealed_count: item.sealed_count, sealed_volume: sv, opened_count: item.opened_count || 0, opened_volume: item.opened_volume || 0.7, opened_remainder: item.opened_remainder || 0, total_volume: item.total_volume, broken_count: item.broken_count || 0, barId: currentBarId });
    } else if (fieldName === 'piece') {
        item.sealed_count = +((item.sealed_count || 0) + addVal).toFixed(0);
        item.total_volume = item.sealed_count;
    } else if (fieldName === 'dish') {
        item.sealed_count = +((item.sealed_count || 0) + addVal).toFixed(0);
        item.total_volume = item.sealed_count - (item.broken_count || 0);
    }
    popup.classList.remove('show');
    renderInventory();
}

function showQuickAddOpened(event, itemId) {
    event.stopPropagation(); event.preventDefault();
    const card = document.querySelector(`.inventory-item[data-item-id="${itemId}"]`);
    const remInput = card?.querySelector('.opened-rem');
    const remainder = parseFloat(remInput?.value) || 0;
    if (remainder <= 0) { alert('Введите остаток в литрах (например: 0.3)'); return; }
    const item = inventoryItems.find(i => i.id === itemId);
    if (!item) return;
    item.opened_count = (item.opened_count || 0) + 1;
    const newOpenedTotal = +(((item.opened_count - 1) * (item.opened_remainder || 0)) + remainder).toFixed(3);
    item.opened_remainder = +(newOpenedTotal / item.opened_count).toFixed(4);
    item.total_volume = +((item.sealed_count || 0) * (item.sealed_volume || 0.7) + newOpenedTotal).toFixed(3);
    if (remInput) remInput.value = '';
    socket.emit('updateItem', { itemId, name: item.name, unit: item.unit, category: item.category || 'alcohol', sealed_count: item.sealed_count || 0, sealed_volume: item.sealed_volume || 0.7, opened_count: item.opened_count, opened_volume: item.opened_volume || 0.7, opened_remainder: item.opened_remainder, total_volume: item.total_volume, broken_count: item.broken_count || 0, barId: currentBarId });
    renderInventory();
}

const savedEmail = localStorage.getItem('mixora_email');
if (savedEmail) { socket.emit('login', { email: savedEmail, password: '', savedSession: true }); }
else { renderLogin(); }

function renderLogin() {
    app.innerHTML = `<div class="screen fade-in"><div class="logo-section" style="text-align:center;"><div class="logo-icon" style="margin:0 auto;">M</div><h1 style="font-weight:500;font-size:28px;margin:12px 0 4px;">Mixora</h1><p style="color:var(--text-secondary);font-size:14px;">Инвентаризация нового уровня</p></div><div class="glass-card"><h2 style="font-weight:500;margin-bottom:16px;">Вход</h2><div class="input-group"><label>Email</label><input type="email" id="loginEmail" placeholder="bar@example.com" class="glass-input"></div><div class="input-group"><label>Пароль</label><input type="password" id="loginPassword" placeholder="••••••••" class="glass-input"></div><div id="loginError" style="color:#ff6b6b;font-size:12px;margin-bottom:10px;display:none;"></div><button class="glass-btn primary full-width" id="loginBtn">Войти</button><p style="text-align:center;margin-top:14px;font-size:13px;">Нет аккаунта? <a href="#" id="goToRegister" style="color:var(--accent-gold);">Регистрация</a></p></div></div>`;
    document.getElementById('loginBtn').addEventListener('click', () => { const e = document.getElementById('loginEmail').value, p = document.getElementById('loginPassword').value; if (!e || !p) { document.getElementById('loginError').style.display='block'; document.getElementById('loginError').innerText='Заполните все поля'; return; } socket.emit('login', { email:e, password:p }); });
    document.getElementById('goToRegister').addEventListener('click', ev => { ev.preventDefault(); renderRegister(); });
}

function renderRegister() {
    app.innerHTML = `<div class="screen fade-in"><div class="glass-card"><h2 style="font-weight:500;margin-bottom:16px;">Регистрация</h2><div class="input-group"><label>Имя</label><input type="text" id="regName" placeholder="Алексей" class="glass-input"></div><div class="input-group"><label>Email</label><input type="email" id="regEmail" placeholder="bar@example.com" class="glass-input"></div><div class="input-group"><label>Пароль (мин. 6 символов, буквы + цифры)</label><input type="password" id="regPassword" placeholder="••••••••" class="glass-input"></div><label style="color:var(--text-secondary);font-size:12px;display:block;">Роль</label><div class="select-role"><div class="role-option active" data-role="bartender">🍸 Бармен</div><div class="role-option" data-role="manager">📊 Бар-менеджер</div></div><div class="input-group" id="managerEmailGroup" style="display:none;"><label>Email менеджера</label><input type="email" id="regManagerEmail" placeholder="manager@example.com" class="glass-input"><div class="manager-email-hint">Менеджер должен быть уже зарегистрирован</div></div><div id="regError" style="color:#ff6b6b;font-size:12px;margin-bottom:10px;display:none;"></div><button class="glass-btn primary full-width" id="registerBtn">Зарегистрироваться</button><p style="text-align:center;margin-top:14px;font-size:13px;">Уже есть аккаунт? <a href="#" id="goToLogin" style="color:var(--accent-gold);">Войти</a></p></div></div>`;
    let role = 'bartender';
    document.querySelectorAll('.role-option').forEach(o => o.addEventListener('click', function() { document.querySelectorAll('.role-option').forEach(x => x.classList.remove('active')); this.classList.add('active'); role = this.dataset.role; document.getElementById('managerEmailGroup').style.display = role === 'bartender' ? 'block' : 'none'; }));
    document.getElementById('registerBtn').addEventListener('click', () => { const n = document.getElementById('regName').value.trim(); const e = document.getElementById('regEmail').value.trim(); const p = document.getElementById('regPassword').value; const me = document.getElementById('regManagerEmail')?.value || ''; const errEl = document.getElementById('regError'); if (n.length < 2) { errEl.style.display='block'; errEl.innerText='Имя должно содержать минимум 2 символа.'; return; } if (!/^.{5,}@.+\..+$/.test(e)) { errEl.style.display='block'; errEl.innerText='Введите корректный email.'; return; } if (p.length < 6 || !/[a-zA-Z]/.test(p) || !/[0-9]/.test(p)) { errEl.style.display='block'; errEl.innerText='Пароль должен быть не менее 6 символов, содержать буквы и цифры.'; return; } errEl.style.display='none'; socket.emit('register', { name:n, email:e, password:p, role, managerEmail:me }); });
    document.getElementById('goToLogin').addEventListener('click', ev => { ev.preventDefault(); renderLogin(); });
}

function showVerificationModal(email) {
    const ov = document.createElement('div');
    ov.className = 'modal-overlay fade-in';
    ov.innerHTML = `<div class="modal-content"><h3 style="font-weight:500;margin-bottom:14px;">Подтверждение email</h3><p style="color:var(--text-secondary);font-size:13px;margin-bottom:16px;">Код отправлен на <b>${email}</b></p><div class="input-group"><input type="text" id="verifyCode" placeholder="6-значный код" class="glass-input" maxlength="6" style="text-align:center;font-size:20px;letter-spacing:4px;"></div><div id="verifyError" style="color:#ff6b6b;font-size:12px;margin-bottom:10px;display:none;"></div><button class="glass-btn primary full-width" id="verifyBtn" style="margin-bottom:8px;">Подтвердить</button><button class="glass-btn full-width" id="resendBtn">📧 Отправить код повторно</button><p style="text-align:center;margin-top:10px;font-size:11px;color:var(--text-secondary);">Код также показан в консоли сервера</p></div>`;
    document.body.appendChild(ov);
    
    document.getElementById('verifyBtn').addEventListener('click', () => {
        const code = document.getElementById('verifyCode').value.trim();
        if (!code) {
            document.getElementById('verifyError').style.display = 'block';
            document.getElementById('verifyError').innerText = 'Введите код';
            return;
        }
        socket.emit('verifyEmail', { email, code });
    });
    
    document.getElementById('resendBtn').addEventListener('click', () => {
        socket.emit('resendCode', { email });
        document.getElementById('verifyError').style.display = 'block';
        document.getElementById('verifyError').style.color = '#2EE59D';
        document.getElementById('verifyError').innerText = 'Новый код отправлен!';
        document.getElementById('resendBtn').disabled = true;
        document.getElementById('resendBtn').innerText = 'Код отправлен';
        setTimeout(() => {
            const btn = document.getElementById('resendBtn');
            if (btn) { btn.disabled = false; btn.innerText = '📧 Отправить код повторно'; }
        }, 30000);
    });
    
    ov.addEventListener('click', e => { if (e.target === ov) ov.remove(); });
}

function updateItemTotal(itemId) {
    const item = inventoryItems.find(i => i.id === parseInt(itemId));
    if (!item) return;
    const card = document.querySelector(`.inventory-item[data-item-id="${itemId}"]`);
    if (!card) return;
    if (item.category === 'dishes') {
        const total = parseFloat(card.querySelector('.dish-total')?.value) || 0;
        const broken = parseFloat(card.querySelector('.dish-broken')?.value) || 0;
        item.sealed_count = total; item.broken_count = broken;
        item.total_volume = Math.max(0, total - broken);
        const cr = card.querySelector('.calc-result'); if (cr) cr.innerText = `Остаток целых: ${item.total_volume} шт`;
    } else if (item.unit === 'л') {
        let sc = parseFloat(card.querySelector('.sealed-count')?.value) || 0;
        let sv = parseFloat(card.querySelector('.sealed-vol')?.value);
        if (isNaN(sv) || card.querySelector('.sealed-vol')?.value === 'custom') sv = parseFloat(card.querySelector('.sealed-vol-custom')?.value) || 0.7;
        let oc = parseFloat(card.querySelector('.opened-count')?.value) || 0;
        let or_ = parseFloat(card.querySelector('.opened-rem')?.value) || 0;
        item.sealed_count = sc; item.sealed_volume = sv;
        item.opened_count = oc; item.opened_remainder = or_;
        item.total_volume = +(sc * sv + oc * or_).toFixed(3);
        const countDisp = document.getElementById(`opened-count-display-${itemId}`);
        const totalDisp = document.getElementById(`opened-total-display-${itemId}`);
        if (countDisp) countDisp.innerText = oc;
        if (totalDisp) totalDisp.innerText = +(oc * or_).toFixed(3);
    } else if (item.unit === 'кг') {
        item.total_volume = parseFloat(card.querySelector('.weight-total')?.value) || 0;
    } else if (item.unit === 'шт' && item.category !== 'dishes') {
        item.sealed_count = parseFloat(card.querySelector('.piece-count')?.value) || 0;
        item.total_volume = item.sealed_count;
    }
    const td = card.querySelector('.total-display'); if (td) td.innerText = `📊 ${item.total_volume} ${item.unit}`;
    const calcRes = card.querySelectorAll('.calc-result');
    if (item.unit === 'л' && calcRes.length >= 1) calcRes[0].innerText = `= ${+(item.sealed_count * item.sealed_volume).toFixed(3)} л`;
}

function saveInventory() { const items = inventoryItems.map(i => ({ id: i.id, sealed_count: i.sealed_count || 0, sealed_volume: i.sealed_volume || 0.7, opened_count: i.opened_count || 0, opened_volume: i.opened_volume || 0.7, opened_remainder: i.opened_remainder || 0, total_volume: i.total_volume || 0, broken_count: i.broken_count || 0 })); socket.emit('saveInventory', { barId: currentBarId, items }); const btn = document.getElementById('saveBtn'); btn.innerText = '✅'; setTimeout(() => { btn.innerText = '💾'; }, 1200); }
function showAddItemModal() { const ov = document.createElement('div'); ov.className='modal-overlay fade-in'; ov.innerHTML=`<div class="modal-content"><h3 style="font-weight:500;margin-bottom:14px;">Новая позиция</h3><div class="input-group"><label>Название</label><input type="text" id="itemName" class="glass-input"></div><div class="input-group"><label>Категория</label><select id="itemCat" class="glass-input" style="color:white;">${Object.entries(catNames).filter(([k]) => k !== 'all').map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select></div><div class="input-group"><label>Единица</label><select id="itemUnit" class="glass-input" style="color:white;"><option value="л">Литры</option><option value="кг">Килограммы</option><option value="шт">Штуки</option></select></div><div style="display:flex;gap:10px;"><button class="glass-btn" id="cancelItem">Отмена</button><button class="glass-btn primary" id="saveItem">Добавить</button></div></div>`; document.body.appendChild(ov); document.getElementById('cancelItem').addEventListener('click', () => ov.remove()); ov.addEventListener('click', e => { if (e.target === ov) ov.remove(); }); document.getElementById('saveItem').addEventListener('click', () => { const n = document.getElementById('itemName').value, u = document.getElementById('itemUnit').value, c = document.getElementById('itemCat').value; if (!n) return; socket.emit('addItem', { barId: currentBarId, name:n, unit:u, category:c }); ov.remove(); }); }
function showEditItemModal(id, name, unit, cat) { const ov = document.createElement('div'); ov.className='modal-overlay fade-in'; ov.innerHTML=`<div class="modal-content"><h3 style="font-weight:500;margin-bottom:14px;">Редактировать</h3><div class="input-group"><label>Название</label><input type="text" id="editName" value="${name}" class="glass-input"></div><div class="input-group"><label>Категория</label><select id="editCat" class="glass-input" style="color:white;">${Object.entries(catNames).filter(([k]) => k !== 'all').map(([k, v]) => `<option value="${k}" ${cat === k ? 'selected' : ''}>${v}</option>`).join('')}</select></div><div class="input-group"><label>Единица измерения</label><select id="editUnit" class="glass-input" style="color:white;"><option value="л" ${unit === 'л' ? 'selected' : ''}>Литры (л)</option><option value="кг" ${unit === 'кг' ? 'selected' : ''}>Килограммы (кг)</option><option value="шт" ${unit === 'шт' ? 'selected' : ''}>Штуки (шт)</option></select></div><div style="display:flex;gap:10px;"><button class="glass-btn" id="cancelEdit">Отмена</button><button class="glass-btn primary" id="saveEdit">Сохранить</button></div></div>`; document.body.appendChild(ov); document.getElementById('cancelEdit').addEventListener('click', () => ov.remove()); ov.addEventListener('click', e => { if (e.target === ov) ov.remove(); }); document.getElementById('saveEdit').addEventListener('click', () => { const n = document.getElementById('editName').value.trim(); const u = document.getElementById('editUnit').value; const c = document.getElementById('editCat').value; if (!n) return; const item = inventoryItems.find(i => i.id === parseInt(id)); if (!item) return; if (u !== item.unit) { item.sealed_count = 0; item.sealed_volume = 0.7; item.opened_count = 0; item.opened_volume = 0.7; item.opened_remainder = 0; item.total_volume = 0; item.broken_count = 0; } item.name = n; item.unit = u; item.category = c; socket.emit('updateItem', { itemId: parseInt(id), name:n, unit:u, category:c, sealed_count: item.sealed_count || 0, sealed_volume: item.sealed_volume || 0.7, opened_count: item.opened_count || 0, opened_volume: item.opened_volume || 0.7, opened_remainder: item.opened_remainder || 0, total_volume: item.total_volume || 0, broken_count: item.broken_count || 0, barId: currentBarId }); ov.remove(); }); }
function showDeleteItemModal(id, name) { const ov = document.createElement('div'); ov.className='modal-overlay fade-in'; ov.innerHTML=`<div class="modal-content"><h3 style="font-weight:500;margin-bottom:12px;">Удалить?</h3><p style="color:var(--text-secondary);font-size:13px;margin-bottom:16px;">«${name}» будет удалена.</p><div style="display:flex;gap:10px;"><button class="glass-btn" id="cancelDelItem">Отмена</button><button class="glass-btn" id="confirmDelItem" style="background:rgba(255,107,107,0.2);border-color:rgba(255,107,107,0.4);color:#ff6b6b;">Удалить</button></div></div>`; document.body.appendChild(ov); document.getElementById('cancelDelItem').addEventListener('click', () => ov.remove()); ov.addEventListener('click', e => { if (e.target === ov) ov.remove(); }); document.getElementById('confirmDelItem').addEventListener('click', () => { socket.emit('deleteItem', { itemId: parseInt(id), barId: currentBarId }); ov.remove(); }); }
function showUploadModal() { const ov = document.createElement('div'); ov.className='modal-overlay fade-in'; ov.innerHTML=`<div class="modal-content"><h3 style="font-weight:500;margin-bottom:8px;">📤 Загрузить бланк</h3><p style="color:var(--text-secondary);font-size:11px;margin-bottom:12px;">Excel (.xlsx) или CSV</p><div class="upload-area" id="dropZone"><div style="font-size:36px;">📁</div><div style="font-size:13px;">Нажмите или перетащите</div><div class="file-name" id="fnDisp"></div><input type="file" id="fileInp" accept=".csv,.xlsx,.xls" style="display:none;"></div><div class="progress-bar" id="progBar"><div class="progress-bar-fill"></div></div><div id="uplErr" style="color:#ff6b6b;font-size:11px;margin:6px 0;display:none;"></div><div id="uplOk" style="color:#2EE59D;font-size:11px;margin:6px 0;display:none;"></div><div style="display:flex;gap:10px;"><button class="glass-btn" id="cancelUpl">Отмена</button><button class="glass-btn primary" id="uplBtn" disabled>Загрузить</button></div><a href="/download-template" style="display:block;text-align:center;color:var(--accent-gold);font-size:11px;margin-top:10px;text-decoration:none;">📥 Шаблон</a></div>`; document.body.appendChild(ov); let file = null; const dz = document.getElementById('dropZone'), fi = document.getElementById('fileInp'), fd = document.getElementById('fnDisp'), ub = document.getElementById('uplBtn'); dz.addEventListener('click', () => fi.click()); dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('dragover'); }); dz.addEventListener('dragleave', () => dz.classList.remove('dragover')); dz.addEventListener('drop', e => { e.preventDefault(); dz.classList.remove('dragover'); if (e.dataTransfer.files.length) { file = e.dataTransfer.files[0]; fd.innerText = file.name; ub.disabled = false; } }); fi.addEventListener('change', () => { if (fi.files.length) { file = fi.files[0]; fd.innerText = file.name; ub.disabled = false; } }); document.getElementById('cancelUpl').addEventListener('click', () => ov.remove()); ov.addEventListener('click', e => { if (e.target === ov) ov.remove(); }); ub.addEventListener('click', async () => { if (!file) return; const fd2 = new FormData(); fd2.append('file', file); fd2.append('barId', currentBarId); document.getElementById('progBar').style.display = 'block'; document.getElementById('progBar').querySelector('.progress-bar-fill').style.width = '50%'; ub.disabled = true; ub.innerText = 'Загружаю...'; try { const r = await fetch('/upload-inventory', { method: 'POST', body: fd2 }); const j = await r.json(); if (j.success) { document.getElementById('uplOk').style.display = 'block'; document.getElementById('uplOk').innerText = `✅ ${j.count} позиций!`; inventoryItems = j.items; setTimeout(() => { ov.remove(); renderInventory(); }, 1000); } else { document.getElementById('uplErr').style.display = 'block'; document.getElementById('uplErr').innerText = '❌ ' + (j.error || 'Ошибка'); ub.disabled = false; ub.innerText = 'Загрузить'; } } catch (err) { document.getElementById('uplErr').style.display = 'block'; document.getElementById('uplErr').innerText = '❌ Ошибка сети'; ub.disabled = false; ub.innerText = 'Загрузить'; } setTimeout(() => { document.getElementById('progBar').style.display = 'none'; }, 2000); }); }

socket.on('loginSuccess', (d) => { currentUser = d.user; localStorage.setItem('mixora_email', d.user.email); localStorage.setItem('mixora_name', d.user.name); localStorage.setItem('mixora_role', d.user.role); renderBarList(d.bars || []); });
socket.on('verificationRequired', (d) => { showVerificationModal(d.email); });
socket.on('registrationSuccess', () => { alert('Email подтверждён! Теперь войдите.'); renderLogin(); });
socket.on('errorMessage', (m) => { alert(m); const e = document.getElementById('bartError') || document.getElementById('verifyError') || document.getElementById('regError'); if (e) { e.style.display = 'block'; e.innerText = m; } });
socket.on('successMessage', (m) => { const e = document.getElementById('bartSuccess'); if (e) { e.style.display = 'block'; e.innerText = '✅ ' + m; } });
socket.on('barsList', (b) => renderBarList(b));
socket.on('barRenamed', () => socket.emit('getBarsList', { userId: currentUser.id, role: currentUser.role }));
socket.on('myBartenders', (b) => renderBartendersList(b));
socket.on('barInventory', (d) => { currentBarId = d.barId; currentBarName = d.barName; inventoryItems = d.items || []; activeCategory = 'all'; searchQuery = ''; renderInventory(); });
socket.on('inventoryUpdated', (items) => { inventoryItems = items; renderInventory(); });
socket.on('inventorySaved', (items) => { inventoryItems = items; renderInventory(); });
socket.on('exportReady', (d) => { const blob = new Blob([d.csv], { type: 'text/csv;charset=utf-8;' }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = d.filename; document.body.appendChild(a); a.click(); document.body.removeChild(a); });

if ('serviceWorker' in navigator) { window.addEventListener('load', () => { navigator.serviceWorker.register('/sw.js'); }); }
</script>
</body>
